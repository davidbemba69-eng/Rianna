<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K-Story 🌸</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5fb;
            color: #333;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* =========================
           EN-TÊTE
        ========================= */

        header {
            background: linear-gradient(135deg, #ff4fa3, #9b4dff);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        /* =========================
           MENU
        ========================= */

        nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav button {
            background: #f3e7ff;
            color: #7a35b8;
            padding: 10px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        nav button:hover {
            background: #e5ccff;
        }

        /* =========================
           PAGES
        ========================= */

        .page {
            display: none;
            max-width: 900px;
            margin: auto;
            padding: 20px 15px 50px;
        }

        .page.active {
            display: block;
        }

        /* =========================
           ACCUEIL
        ========================= */

        .welcome {
            text-align: center;
            padding: 35px 10px;
        }

        .welcome h2 {
            color: #c8328c;
            font-size: 28px;
        }

        .welcome p {
            font-size: 17px;
            line-height: 1.6;
        }

        .main-button {
            background: linear-gradient(135deg, #ff4fa3, #9b4dff);
            color: white;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 15px;
        }

        /* =========================
           ÉCRITURE
        ========================= */

        .editor-box {
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .editor-box h2 {
            margin-top: 0;
            color: #c8328c;
        }

        .input-label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
            color: #633b73;
        }

        #storyTitle {
            width: 100%;
            padding: 14px;
            border: 2px solid #ead8f4;
            border-radius: 12px;
            font-size: 20px;
            outline: none;
        }

        #storyTitle:focus,
        #storyText:focus {
            border-color: #c85be9;
        }

        /* IMAGE DE L'HISTOIRE */

        .image-button {
            display: inline-block;
            background: #f2ddff;
            color: #7b35a6;
            padding: 11px 15px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #imageInput {
            display: none;
        }

        #imagePreviewContainer {
            display: none;
            margin: 10px 0 18px;
            text-align: center;
        }

        #imagePreview {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 15px;
            display: block;
        }

        #removeImageButton {
            background: #ff5c8a;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 8px;
        }

        /* ZONE D'ÉCRITURE */

        #storyText {
            width: 100%;
            min-height: 450px;
            resize: vertical;
            padding: 16px;
            border: 2px solid #ead8f4;
            border-radius: 14px;
            font-family: Arial, sans-serif;
            font-size: 17px;
            line-height: 1.7;
            outline: none;
        }

        .editor-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .save-button {
            background: #9b4dff;
            color: white;
            padding: 13px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        .publish-button {
            background: #ff4fa3;
            color: white;
            padding: 13px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        .new-button {
            background: #eee;
            color: #555;
            padding: 13px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        /* =========================
           LECTURE
        ========================= */

        #storiesList {
            display: grid;
            gap: 18px;
        }

        .story-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .story-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .story-card-content {
            padding: 18px;
        }

        .story-card h3 {
            color: #b7358a;
            margin-top: 0;
        }

        .story-card p {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .read-button {
            background: #9b4dff;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            margin-top: 8px;
        }

        .delete-button {
            background: #ff5c5c;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            margin-top: 8px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 18px;
            color: #777;
        }

        /* =========================
           LECTURE D'UNE HISTOIRE
        ========================= */

        #reader {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        #readerTitle {
            color: #c8328c;
            font-size: 30px;
            margin-top: 0;
        }

        #readerImage {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 15px;
            margin: 10px 0 20px;
            display: none;
        }

        #readerText {
            white-space: pre-wrap;
            font-size: 18px;
            line-height: 1.8;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            nav {
                gap: 5px;
                overflow-x: auto;
                justify-content: flex-start;
            }

            nav button {
                white-space: nowrap;
                font-size: 14px;
                padding: 9px 12px;
            }

            .page {
                padding: 15px 10px 40px;
            }

            #storyText {
                min-height: 500px;
                font-size: 16px;
            }

            #storyTitle {
                font-size: 18px;
            }

            .editor-buttons button {
                width: 100%;
            }

            #readerTitle {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         EN-TÊTE
    ========================= -->

    <header>
        <h1>🌸 K-Story</h1>
        <p>Écris, publie et découvre des histoires ✨</p>
    </header>

    <!-- =========================
         MENU
    ========================= -->

    <nav>
        <button onclick="showPage('homePage')">🏠 Accueil</button>
        <button onclick="showPage('writePage')">✍️ Histoire</button>
        <button onclick="showPage('readPage'); displayStories()">📚 Lire</button>
    </nav>

    <!-- =========================
         ACCUEIL
    ========================= -->

    <section id="homePage" class="page active">

        <div class="welcome">

            <h2>Bienvenue sur K-Story 🌸</h2>

            <p>
                Crée tes propres histoires, ajoute une image,
                sauvegarde-les et relis-les quand tu veux.
            </p>

            <button class="main-button" onclick="newStory()">
                ✍️ Écrire une histoire
            </button>

        </div>

    </section>

    <!-- =========================
         PAGE D'ÉCRITURE
    ========================= -->

    <section id="writePage" class="page">

        <div class="editor-box">

            <h2>✍️ Écrire mon histoire</h2>

            <!-- TITRE -->

            <label class="input-label">
                📖 Titre de l'histoire
            </label>

            <input
                type="text"
                id="storyTitle"
                placeholder="Exemple : Mon rêve en Corée 🌸"
            >

            <!-- IMAGE -->

            <label class="input-label">
                🖼️ Image de l'histoire
            </label>

            <label for="imageInput" class="image-button">
                🖼️ Choisir une image
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <div id="imagePreviewContainer">

                <img
                    id="imagePreview"
                    alt="Image de l'histoire"
                >

                <button
                    id="removeImageButton"
                    onclick="removeStoryImage()"
                >
                    🗑️ Supprimer l'image
                </button>

            </div>

            <!-- TEXTE -->

            <label class="input-label">
                ✏️ Ton histoire
            </label>

            <textarea
                id="storyText"
                placeholder="Écris ton histoire ici..."
            ></textarea>

            <!-- BOUTONS -->

            <div class="editor-buttons">

                <button
                    class="save-button"
                    onclick="saveStory(false)"
                >
                    💾 Enregistrer
                </button>

                <button
                    class="publish-button"
                    onclick="saveStory(true)"
                >
                    🌸 Publier
                </button>

                <button
                    class="new-button"
                    onclick="newStory()"
                >
                    📝 Nouvelle histoire
                </button>

            </div>

        </div>

    </section>

    <!-- =========================
         PAGE LIRE
    ========================= -->

    <section id="readPage" class="page">

        <h2>📚 Mes histoires</h2>

        <div id="storiesList"></div>

    </section>

    <!-- =========================
         PAGE LECTURE
    ========================= -->

    <section id="readerPage" class="page">

        <div id="reader">

            <h2 id="readerTitle"></h2>

            <img
                id="readerImage"
                alt="Image de couverture"
            >

            <div id="readerText"></div>

            <button
                class="main-button"
                onclick="showPage('readPage'); displayStories()"
            >
                ← Retour aux histoires
            </button>

        </div>

    </section>

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="script.js"></script>

</body>
    </html>
